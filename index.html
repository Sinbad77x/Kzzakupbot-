    <script>
        let currentMode = 'quick';

        const SAMPLE_TENDERS = [
            { num: "12849102-1", title: "Закупка офисной бумаги А4 и канцтоваров", organizer: "ГУ Аппарат Акима г. Шымкент", sum: "850 000 ₸", region: "Шымкент", amount: 850000 },
            { num: "12849105-1", title: "Обслуживание компьютерной техники", organizer: "Управление образования г. Астана", sum: "5 800 000 ₸", region: "Астана", amount: 5800000 },
            { num: "CT-904", title: "Поставка строительных материалов (цемент, арматура)", organizer: "ТОО СтройСервис-Шымкент", sum: "14 000 000 ₸", region: "Шымкент", amount: 14000000 }
        ];

        function setCalcMode(mode) {
            currentMode = mode;
            document.getElementById('btnQuick').classList.toggle('active', mode === 'quick');
            document.getElementById('btnAdvanced').classList.toggle('active', mode === 'advanced');
            
            const advFields = document.querySelectorAll('.adv-field');
            advFields.forEach(el => el.style.display = mode === 'advanced' ? 'flex' : 'none');
            
            calculateMargin();
        }

        function calculateMargin() {
            let lotSum = parseFloat(document.getElementById('calcLotSum').value) || 0;
            let cost = parseFloat(document.getElementById('calcCost').value) || 0;
            let delivery = parseFloat(document.getElementById('calcDelivery').value) || 0;

            let taxes = 0;
            let riskAndCommissions = 0;
            let taxName = "УСН (3%)";

            if (currentMode === 'advanced') {
                let taxRate = parseFloat(document.getElementById('calcTaxMode').value) || 0;
                let riskRate = (parseFloat(document.getElementById('calcRisk').value) || 0) / 100;
                taxes = lotSum * taxRate;
                riskAndCommissions = lotSum * riskRate;
                
                let select = document.getElementById('calcTaxMode');
                taxName = select.options[select.selectedIndex].text;
            } else {
                taxes = lotSum * 0.03; // Базовый расчет для быстрого режима
            }

            let directCosts = cost + delivery;
            let totalExpenses = directCosts + taxes + riskAndCommissions;
            let profit = lotSum - totalExpenses;
            let margin = lotSum > 0 ? (profit / lotSum) * 100 : 0;
            let breakeven = totalExpenses;

            // Выводим детальную разбивку в блок результатов
            let resultHTML = `
                <p><span>Прямые затраты (закуп + доставка):</span> <strong>${directCosts.toLocaleString('ru-RU')} ₸</strong></p>
                <p><span>Налоги (${taxName}):</span> <strong>${taxes.toLocaleString('ru-RU')} ₸</strong></p>
            `;
            
            if (currentMode === 'advanced') {
                resultHTML += `<p><span>Резервы и комиссии:</span> <strong>${riskAndCommissions.toLocaleString('ru-RU')} ₸</strong></p>`;
            }

            resultHTML += `
                <p><span>Чистая расчетная прибыль:</span> <strong id="resProfit" style="color: #059669;">${profit.toLocaleString('ru-RU')} ₸</strong></p>
                <p><span>Рентабельность (маржинальность):</span> <strong id="resMargin">${margin.toFixed(1)}%</strong></p>
                <p class="total"><span>Точка безубыточности торгов:</span> <strong id="resBreakeven">${breakeven.toLocaleString('ru-RU')} ₸</strong></p>
            `;

            document.getElementById('calcResultBox').innerHTML = resultHTML;
        }

        function performWebSearch() {
            let text = document.getElementById('queryText').value.toLowerCase().trim();
            let region = document.getElementById('queryRegion').value;
            let budget = document.getElementById('queryBudget').value;

            let filtered = SAMPLE_TENDERS.filter(t => {
                let matchesText = text === "" || t.title.toLowerCase().includes(text) || t.organizer.toLowerCase().includes(text);
                let matchesRegion = region === "all" || t.region === region;
                let matchesBudget = true;

                if (budget === "1m") matchesBudget = t.amount <= 1000000;
                else if (budget === "1m_10m") matchesBudget = t.amount > 1000000 && t.amount <= 10000000;
                else if (budget === "10m") matchesBudget = t.amount > 10000000;

                return matchesText && matchesRegion && matchesBudget;
            });

            let box = document.getElementById('resultsBox');
            box.style.display = 'block';

            if (filtered.length === 0) {
                box.innerHTML = '<div class="tender-card" style="background:#fef2f2; border-color:#f87171; color:#991b1b;">😔 По вашему запросу актуальных лотов не найдено. Настройте авто-уведомления в Telegram, чтобы не пропустить новые поступления.</div>';
            } else {
                let html = '<h4 style="margin-bottom:8px; font-size:14px; color:#059669;">Актуальные результаты поиска:</h4>';
                filtered.forEach(t => {
                    html += `<div class="tender-card">
                        <strong>${t.num}</strong> (${t.region})<br>
                        ${t.title}<br>
                        Заказчик: ${t.organizer}<br>
                        Сумма: <b>${t.sum}</b>
                    </div>`;
                });
                box.innerHTML = html;
            }

            // Передаем параметры фильтра в Telegram через deep linking
            let tgLink = `https://t.me/Kzzakupbot?start=region_${encodeURIComponent(region)}_bud_${encodeURIComponent(budget)}`;
            document.getElementById('tgSubLink').href = tgLink;
        }

        calculateMargin();
    </script>
