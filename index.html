<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kzzakupbot Hub — Рабочее пространство поставщика Казахстана</title>
    <style>
        :root {
            --primary: #0047AB;
            --primary-dark: #003380;
            --accent: #00BFFF;
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --text: #1E293B;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --success: #10B981;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 30px 20px;
            border-radius: var(--radius);
            box-shadow: 0 4px 15px rgba(0, 71, 171, 0.15);
        }

        header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        .btn-tg {
            display: inline-block;
            background-color: #229ED9;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 4px 10px rgba(34, 158, 217, 0.3);
            transition: background 0.2s;
        }

        .btn-tg:hover {
            background-color: #1d88bc;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border);
        }

        h2 {
            font-size: 18px;
            color: var(--primary);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        .search-box button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-box button:hover {
            background-color: var(--primary-dark);
        }

        .results-container {
            margin-top: 15px;
        }

        .lot-item {
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 10px;
            background: #FAFAFA;
        }

        .lot-title {
            font-weight: 600;
            color: var(--text);
            margin-bottom: 5px;
        }

        .lot-info {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 8px;
        }

        .lot-price {
            font-weight: bold;
            color: var(--success);
        }

        .calc-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        @media (max-width: 600px) {
            .calc-grid {
                grid-template-columns: 1fr;
            }
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
        }

        .calc-results {
            background: #F1F5F9;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .calc-results p {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .calc-results .total {
            font-weight: bold;
            color: var(--primary);
            font-size: 16px;
            border-top: 1px solid var(--border);
            padding-top: 8px;
            margin-top: 8px;
        }

        .msg-error {
            color: #EF4444;
            font-size: 14px;
            padding: 10px;
            background: #FEF2F2;
            border-radius: 8px;
            border: 1px solid #FCA5A5;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🇰🇿 Kzzakupbot Hub</h1>
        <p>Рабочее пространство поставщика Казахстана</p>
        <a href="https://t.me/kzzakupbot" class="btn-tg" target="_blank">💬 Запустить в Telegram</a>
    </header>

    <!-- Поиск лотов -->
    <div class="card" id="search-section">
        <h2>🔍 Поиск актуальных закупок РК</h2>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Введите ключевое слово (например: Бумага, IT)..." value="Бумага">
            <button onclick="performSearch()">Найти</button>
        </div>
        <div id="searchResults" class="results-container">
            <div style="color: var(--text-muted); font-size: 14px; text-align: center; padding: 10px;">Нажмите «Найти» для загрузки лотов</div>
        </div>
    </div>

    <!-- Калькулятор -->
    <div class="card" id="calculator">
        <h2>🧮 Калькулятор сделки (НК РК 2026)</h2>
        <div class="calc-grid">
            <div class="input-group">
                <label>Сумма контракта (Выручка), ₸</label>
                <input type="number" id="revenue" value="5000000" oninput="calculateProfit()">
            </div>
            <div class="input-group">
                <label>Себестоимость товара, ₸</label>
                <input type="number" id="cost" value="3500000" oninput="calculateProfit()">
            </div>
            <div class="input-group">
                <label>Логистика и доставка, ₸</label>
                <input type="number" id="logistics" value="150000" oninput="calculateProfit()">
            </div>
            <div class="input-group">
                <label>Комиссия за БГ (Банковская гарантия), ₸</label>
                <input type="number" id="bg_fee" value="25000" oninput="calculateProfit()">
            </div>
        </div>
        
        <div class="calc-results">
            <p>Прямые затраты: <span id="res-costs">3 675 000 ₸</span></p>
            <p>Налог СНР (4%): <span id="res-tax">200 000 ₸</span></p>
            <p class="total">Расчётная прибыль: <span id="res-profit">1 125 000 ₸</span></p>
            <p>Маржинальность: <span id="res-margin" style="font-weight: bold; color: var(--success);">22.5%</span></p>
        </div>
    </div>
</div>

<script>
async function performSearch() {
    const query = document.getElementById('searchInput').value.trim();
    const resultsContainer = document.getElementById('searchResults');
    
    if (!query) {
        resultsContainer.innerHTML = '<div class="msg-error">Введите ключевое слово для поиска.</div>';
        return;
    }

    resultsContainer.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 15px;">Загрузка данных с портала госзакупок...</div>';

    try {
        const response = await fetch('/api/search?q=' + encodeURIComponent(query));
        const data = await response.json();

        if (!data.success) {
            resultsContainer.innerHTML = `<div class="msg-error">${data.message || 'Ошибка загрузки данных'}</div>`;
            return;
        }

        if (!data.data || data.data.length === 0) {
            resultsContainer.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 15px;">По вашему запросу ничего не найдено.</div>';
            return;
        }

        let html = '';
        data.data.forEach((lot, index) => {
            html += `
                <div class="lot-item">
                    <div class="lot-title">${index + 1}. ${escapeHtml(lot.name)}</div>
                    <div class="lot-info">
                        <span>🏛 Заказчик: ${escapeHtml(lot.organizer)}</span>
                        <span class="lot-price">${Number(lot.amount).toLocaleString('ru-RU')} ₸</span>
                    </div>
                    <div style="margin-top: 8px;">
                        <a href="${lot.url}" target="_blank" style="font-size: 13px; color: var(--primary); text-decoration: none;">Открыть лот на портале →</a>
                    </div>
                </div>
            `;
        });
        resultsContainer.innerHTML = html;

    } catch (error) {
        resultsContainer.innerHTML = '<div class="msg-error">Не удалось связаться с сервером. Убедитесь, что бэкенд запущен.</div>';
    }
}

function calculateProfit() {
    const revenue = parseFloat(document.getElementById('revenue').value) || 0;
    const cost = parseFloat(document.getElementById('cost').value) || 0;
    const logistics = parseFloat(document.getElementById('logistics').value) || 0;
    const bgFee = parseFloat(document.getElementById('bg_fee').value) || 0;

    const directCosts = cost + logistics + bgFee;
    const tax = revenue * 0.04;
    const profit = revenue - directCosts - tax;
    const margin = revenue > 0 ? (profit / revenue) * 100 : 0;

    document.getElementById('res-costs').innerText = directCosts.toLocaleString('ru-RU') + ' ₸';
    document.getElementById('res-tax').innerText = tax.toLocaleString('ru-RU') + ' ₸';
    document.getElementById('res-profit').innerText = profit.toLocaleString('ru-RU') + ' ₸';
    document.getElementById('res-margin').innerText = margin.toFixed(1) + '%';
}

function escapeHtml(text) {
    if (!text) return '';
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

// Автоматический поиск при загрузке
window.onload = function() {
    performSearch();
};
</script>

</body>
</html>
